<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Anukalp Dixit, building autonomous AI agent systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10253a"/>
      <stop offset="1" stop-color="#0e4a57"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ce5c6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2ce5c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ce5c6"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- agent graph -->
  <g stroke="#2ce5c6" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <path d="M900 160 L800 80"/>
    <path d="M900 160 L790 160"/>
    <path d="M900 160 L800 245"/>
    <path d="M900 160 L1010 70"/>
    <path d="M900 160 L1030 150"/>
    <path d="M900 160 L1010 250"/>
    <path d="M800 80 L720 120"/>
    <path d="M790 160 L720 120"/>
    <path d="M790 160 L725 205"/>
    <path d="M800 245 L725 205"/>
    <path d="M1010 70 L1100 105"/>
    <path d="M1030 150 L1100 105"/>
    <path d="M1030 150 L1105 200"/>
    <path d="M1010 250 L1105 200"/>
  </g>
  <g fill="#0b1220" stroke="#58a6ff" stroke-width="2">
    <circle cx="800" cy="80" r="10"/>
    <circle cx="790" cy="160" r="10"/>
    <circle cx="800" cy="245" r="10"/>
    <circle cx="1010" cy="70" r="10"/>
    <circle cx="1030" cy="150" r="10"/>
    <circle cx="1010" cy="250" r="10"/>
  </g>
  <g fill="#58a6ff" fill-opacity="0.8">
    <circle cx="720" cy="120" r="5"/>
    <circle cx="725" cy="205" r="5"/>
    <circle cx="1100" cy="105" r="5"/>
    <circle cx="1105" cy="200" r="5"/>
  </g>
  <!-- master node -->
  <circle cx="900" cy="160" r="34" fill="#2ce5c6" fill-opacity="0.12"/>
  <circle cx="900" cy="160" r="22" fill="#0b1220" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="900" cy="160" r="8" fill="url(#accent)"/>

  <!-- text -->
  <text x="70" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">Anukalp Dixit</text>
  <rect x="72" y="140" width="84" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#d6e4ee">Building autonomous AI agent systems</text>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#bfeee6">
    <rect x="70" y="222" width="132" height="34" rx="17" fill="#2ce5c6" fill-opacity="0.12" stroke="#2ce5c6" stroke-opacity="0.5"/>
    <text x="136" y="244" text-anchor="middle">Multi-Agent</text>
    <rect x="214" y="222" width="76" height="34" rx="17" fill="#2ce5c6" fill-opacity="0.12" stroke="#2ce5c6" stroke-opacity="0.5"/>
    <text x="252" y="244" text-anchor="middle">MCP</text>
    <rect x="302" y="222" width="150" height="34" rx="17" fill="#2ce5c6" fill-opacity="0.12" stroke="#2ce5c6" stroke-opacity="0.5"/>
    <text x="377" y="244" text-anchor="middle">Dynamic Tooling</text>
    <rect x="464" y="222" width="132" height="34" rx="17" fill="#2ce5c6" fill-opacity="0.12" stroke="#2ce5c6" stroke-opacity="0.5"/>
    <text x="530" y="244" text-anchor="middle">Local-First</text>
  </g>
</svg>
